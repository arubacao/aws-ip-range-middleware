name: "Run Tests"

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.1
          - php: '8.1'
            laravel: '9.*'
            testbench: '7.*'
            phpunit: '^9.5'
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '^10.0'
          # PHP 8.2
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '^10.0'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '^10.5'
          # PHP 8.3
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '^10.5'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '^11.0'
          # PHP 8.4
          - php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '^10.5'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '^11.0'

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Execute tests
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, zip
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-static-php-8.3-composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  style:
    runs-on: ubuntu-latest
    name: Code style

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, zip
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-style-php-8.3-composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Run Pint
        run: vendor/bin/pint --test
